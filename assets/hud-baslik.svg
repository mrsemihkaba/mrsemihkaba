<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <radialGradient id="zemin" cx="22%" cy="50%" r="85%">
      <stop offset="0" stop-color="#0c2238"/>
      <stop offset=".55" stop-color="#060d1a"/>
      <stop offset="1" stop-color="#03060d"/>
    </radialGradient>
    <radialGradient id="cekirdek" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#bff3ff"/>
      <stop offset=".7" stop-color="#4fd1ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="parilti" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="izgara" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#4fd1ff" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="tarama" x1="0" x2="1">
      <stop offset="0" stop-color="#4fd1ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4fd1ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .etiket { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; letter-spacing: 3px; }
    .yanson { animation: yanson 1.4s ease-in-out infinite; }
    @keyframes yanson { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    .ad { animation: belir 1.2s ease-out both; }
    @keyframes belir { from { opacity: 0; letter-spacing: 18px } to { opacity: 1; letter-spacing: 4px } }
  </style>

  <rect width="1000" height="360" rx="18" fill="url(#zemin)"/>
  <rect width="1000" height="360" rx="18" fill="url(#izgara)"/>
  <rect x="-200" y="0" width="200" height="360" fill="url(#tarama)">
    <animate attributeName="x" from="-200" to="1000" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD köşeleri -->
  <g stroke="#4fd1ff" stroke-width="2" fill="none" stroke-opacity=".8">
    <path d="M22 60V22H60"/><path d="M940 22H978V60"/><path d="M978 300V338H940"/><path d="M60 338H22V300"/>
  </g>

  <!-- Enerji çekirdeği -->
  <g transform="translate(190 180)">
    <circle r="132" fill="none" stroke="#4fd1ff" stroke-opacity=".12" stroke-width="18"/>
    <g>
      <circle r="122" fill="none" stroke="#4fd1ff" stroke-width="2" stroke-dasharray="4 10" stroke-opacity=".7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="100" fill="none" stroke="#4fd1ff" stroke-width="10" stroke-dasharray="42 10" stroke-opacity=".55"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
    </g>
    <g stroke="#9be7ff" stroke-width="3" stroke-opacity=".9" filter="url(#parilti)">
      <line x1="0" y1="-62" x2="0" y2="-82"/><line x1="0" y1="62" x2="0" y2="82"/>
      <line x1="-62" y1="0" x2="-82" y2="0"/><line x1="62" y1="0" x2="82" y2="0"/>
      <line x1="44" y1="44" x2="58" y2="58"/><line x1="-44" y1="-44" x2="-58" y2="-58"/>
      <line x1="44" y1="-44" x2="58" y2="-58"/><line x1="-44" y1="44" x2="-58" y2="58"/>
    </g>
    <circle r="60" fill="none" stroke="#4fd1ff" stroke-width="3" filter="url(#parilti)"/>
    <circle r="54" fill="url(#cekirdek)">
      <animate attributeName="r" values="50;56;50" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".85;1;.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="11" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="1" filter="url(#parilti)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">SK</text>
  </g>

  <!-- Kimlik -->
  <text x="400" y="92" class="etiket" font-size="14" fill="#4fd1ff">KABAFORCE // WORKSTATION</text>
  <text x="398" y="166" class="ad" font-size="66" font-weight="800" fill="#ffffff" letter-spacing="4">SEMİH KABA</text>
  <text x="400" y="204" font-size="20" font-weight="600" fill="#f5b942" letter-spacing="1.5">SOC · Pentester · Developer</text>

  <!-- Durum satırları -->
  <g class="etiket" font-size="13" fill="#9fb4c8">
    <g transform="translate(400 246)">
      <circle cx="5" cy="-4" r="5" fill="#22e3a4" class="yanson"/>
      <text x="20" y="0">SİSTEMLER ............ <tspan fill="#22e3a4">ÇEVRİMİÇİ</tspan></text>
    </g>
    <g transform="translate(400 274)">
      <circle cx="5" cy="-4" r="5" fill="#4fd1ff" class="yanson" style="animation-delay:.4s"/>
      <text x="20" y="0">KABAOS ............... <tspan fill="#4fd1ff">ETKİN</tspan></text>
    </g>
    <g transform="translate(400 302)">
      <circle cx="5" cy="-4" r="5" fill="#ff5b5b" class="yanson" style="animation-delay:.8s"/>
      <text x="20" y="0">GÜVENLİK ÇEVRESİ ..... <tspan fill="#ff5b5b">KURULU</tspan></text>
    </g>
  </g>

  <!-- Sağ alt göstergeler -->
  <g transform="translate(830 270)" class="etiket" font-size="11" fill="#4fd1ff" fill-opacity=".75">
    <text x="0" y="0">GÜÇ</text>
    <rect x="0" y="8" width="120" height="6" rx="3" fill="#4fd1ff" fill-opacity=".15"/>
    <rect x="0" y="8" width="0" height="6" rx="3" fill="#4fd1ff">
      <animate attributeName="width" values="0;112;104;112" dur="3s" fill="freeze"/>
    </rect>
    <text x="0" y="36">ODAK</text>
    <rect x="0" y="44" width="120" height="6" rx="3" fill="#f5b942" fill-opacity=".15"/>
    <rect x="0" y="44" width="0" height="6" rx="3" fill="#f5b942">
      <animate attributeName="width" values="0;120" dur="3.6s" fill="freeze"/>
    </rect>
  </g>
</svg>
