<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <style>
    .m { font-family: 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; letter-spacing: 2px; }
    .k { animation: k .5s ease-out both; } @keyframes k { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform: none } }
    .y { animation: y 1.8s ease-in-out infinite; } @keyframes y { 50% { opacity: .25 } }
  </style>
  <defs>
    <radialGradient id="z" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#0c2238"/><stop offset="1" stop-color="#03060d"/></radialGradient>
    <pattern id="i" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#4fd1ff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1000" height="290" rx="16" fill="url(#z)"/><rect width="1000" height="290" rx="16" fill="url(#i)"/>
  <g stroke="#ff5b5b" stroke-width="2" fill="none" stroke-opacity=".8"><path d="M20 52V20H52"/><path d="M948 20H980V52"/><path d="M980 238V270H948"/><path d="M52 270H20V238"/></g>
  <text x="44" y="56" class="m" font-size="13" fill="#ff5b5b">SAVUNMA SİSTEMLERİ // DEFENSE GRID</text>
  <text x="44" y="90" font-size="24" font-weight="800" fill="#ffffff">Güvenliği araçla değil, mimariyle kuruyorum.</text>
  <g transform="translate(860 60)"><circle r="16" fill="none" stroke="#ff5b5b" stroke-opacity=".7" stroke-width="2"/>
    <path d="M0 0 L0 -16" stroke="#ff5b5b" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/></path>
    <circle r="3" fill="#ff5b5b"/></g>
  <text x="884" y="65" class="m" font-size="11" fill="#ff5b5b" fill-opacity=".85">TARAMA</text>

  <g class="k" style="animation-delay:0.20s">
    <path d="M56 118H336L344 126V242L332 254H44V130Z" fill="#071222" stroke="#4fd1ff" stroke-opacity=".5"/>
    <path d="M44 148V130L56 118H88" fill="none" stroke="#4fd1ff" stroke-width="3"/>
    <text x="62" y="148" class="m" font-size="11" fill="#4fd1ff">01 · NETWORK</text>
    <circle cx="322" cy="144" r="4.5" fill="#4fd1ff" class="y" style="animation-delay:0.0s"/>
    <text x="62" y="180" font-size="20" font-weight="800" fill="#ffffff">AĞ GÜVENLİĞİ</text>
    <text x="62" y="210" font-size="13" fill="#b5c6d8">Sıfır güven tünel mimarisi, WAF ve</text>
    <text x="62" y="230" font-size="13" fill="#b5c6d8">hız sınırlama, saldırı yüzeyi denetimi.</text>
  </g>
  <g class="k" style="animation-delay:0.35s">
    <path d="M368 118H648L656 126V242L644 254H356V130Z" fill="#071222" stroke="#22e3a4" stroke-opacity=".5"/>
    <path d="M356 148V130L368 118H400" fill="none" stroke="#22e3a4" stroke-width="3"/>
    <text x="374" y="148" class="m" font-size="11" fill="#22e3a4">02 · ENDPOINT</text>
    <circle cx="634" cy="144" r="4.5" fill="#22e3a4" class="y" style="animation-delay:0.3s"/>
    <text x="374" y="180" font-size="20" font-weight="800" fill="#ffffff">UÇ NOKTA</text>
    <text x="374" y="210" font-size="13" fill="#b5c6d8">Secure Boot zinciri, zorunlu erişim</text>
    <text x="374" y="230" font-size="13" fill="#b5c6d8">denetimi, tam disk şifreleme, bütünlük kilidi.</text>
  </g>
  <g class="k" style="animation-delay:0.50s">
    <path d="M680 118H960L968 126V242L956 254H668V130Z" fill="#071222" stroke="#f5b942" stroke-opacity=".5"/>
    <path d="M668 148V130L680 118H712" fill="none" stroke="#f5b942" stroke-width="3"/>
    <text x="686" y="148" class="m" font-size="11" fill="#f5b942">03 · INFOSEC</text>
    <circle cx="946" cy="144" r="4.5" fill="#f5b942" class="y" style="animation-delay:0.6s"/>
    <text x="686" y="180" font-size="20" font-weight="800" fill="#ffffff">BİLGİ GÜVENLİĞİ</text>
    <text x="686" y="210" font-size="13" fill="#b5c6d8">Kimlik ve erişim, kriptografi ve PKI,</text>
    <text x="686" y="230" font-size="13" fill="#b5c6d8">adli bilişim, tehdit tespiti ve uyum.</text>
  </g>
</svg>
